<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Calibration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#d7f5f5"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7ec4"/>
      <stop offset="1" stop-color="#17b3c4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Large gauge -->
  <circle cx="230" cy="250" r="130" fill="#ffffff" stroke="url(#dial)" stroke-width="10"/>
  <circle cx="230" cy="250" r="130" fill="none" stroke="#0a5f96" stroke-width="2" stroke-dasharray="4 10"/>
  <g stroke="#0a5f96" stroke-width="4" stroke-linecap="round">
    <line x1="230" y1="140" x2="230" y2="160"/>
    <line x1="340" y1="250" x2="320" y2="250"/>
    <line x1="230" y1="360" x2="230" y2="340"/>
    <line x1="120" y1="250" x2="140" y2="250"/>
  </g>
  <line x1="230" y1="250" x2="290" y2="185" stroke="#0e7ec4" stroke-width="7" stroke-linecap="round"/>
  <circle cx="230" cy="250" r="12" fill="#0a5f96"/>

  <!-- Small gauge -->
  <circle cx="420" cy="380" r="90" fill="#ffffff" stroke="url(#dial)" stroke-width="8"/>
  <line x1="420" y1="380" x2="380" y2="330" stroke="#17b3c4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="420" cy="380" r="9" fill="#0a5f96"/>

  <!-- Base bar -->
  <rect x="120" y="470" width="360" height="26" rx="13" fill="#0e7ec4" opacity="0.85"/>
  <rect x="150" y="500" width="300" height="14" rx="7" fill="#17b3c4" opacity="0.6"/>

  <text x="300" y="560" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0a5f96">Precision Calibration</text>
</svg>
