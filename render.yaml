# Render.com Blueprint for WordPress + MySQL.
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint"
# and point it at your repo. Render reads this file automatically.
#
# NOTE: Render's free tier sleeps after inactivity and the free database is
# time-limited. For a permanent business site, upgrade the plans below.

services:
  - type: web
    name: abudhabi-calibration
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    envVars:
      - key: WORDPRESS_DB_HOST
        fromDatabase:
          name: abudhabi-db
          property: host
      - key: WORDPRESS_DB_NAME
        fromDatabase:
          name: abudhabi-db
          property: database
      - key: WORDPRESS_DB_USER
        fromDatabase:
          name: abudhabi-db
          property: user
      - key: WORDPRESS_DB_PASSWORD
        fromDatabase:
          name: abudhabi-db
          property: password

databases:
  - name: abudhabi-db
    plan: free
