# Render.com Blueprint for WordPress (SQLite — no separate database needed).
#
# Deploy: push this repo to GitHub, then in Render click "New +" -> "Blueprint"
# and select this repo. Render reads this file automatically and builds the
# Docker image in deploy/Dockerfile.
#
# NOTE: Render's free tier sleeps after ~15 min of inactivity (first visit
# after that is slow to wake). Great for a demo. For a permanent business
# site, use a paid plan (and add a persistent disk), or a WordPress host.

services:
  - type: web
    name: abudhabi-calibration
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
